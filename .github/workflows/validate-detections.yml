name: Validate detections

# Detection-as-code: every Sigma rule is validated on push/PR so a broken rule
# never reaches main.

on:
  push:
    paths:
      - 'detections/**'
      - '.github/workflows/validate-detections.yml'
  pull_request:
    paths:
      - 'detections/**'
  workflow_dispatch:

jobs:
  sigma-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sigma-cli
        run: pip install sigma-cli

      - name: Validate Sigma rules
        run: sigma check detections/
